name: BAXIO checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: baxio_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Configure isolated test database
        run: |
          printf '%s\n' 'DATABASE_URL="mysql://root:ci-only-password@127.0.0.1:3306/baxio_e2e"' 'JWT_SECRET="ci-only-session-secret-never-use-in-production"' > backend/.env
      - run: npx prisma generate && npm run build && npm test
        working-directory: backend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            frontend/playwright-report
            frontend/test-results
