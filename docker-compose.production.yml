services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ${BAXIO_ENV_FILE:-./deployment/production.env}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --skip-name-resolve
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  migrate:
    build: ./backend
    profiles: ["tools"]
    env_file: ${BAXIO_ENV_FILE:-./deployment/production.env}
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ${BAXIO_ENV_FILE:-./deployment/production.env}
    environment:
      NODE_ENV: production
      PORT: 4000
    volumes:
      - uploads_data:/var/lib/baxio/uploads
      - backups_data:/var/lib/baxio/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file: ${BAXIO_ENV_FILE:-./deployment/production.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    networks: [internal]

volumes:
  mysql_data:
  uploads_data:
  backups_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
